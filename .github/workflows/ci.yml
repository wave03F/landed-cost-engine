name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Backend: Python tests
  # ─────────────────────────────────────────────────────────────────────────
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov aiosqlite

      - name: Run tests with coverage
        env:
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          APP_ENV: "test"
          JWT_SECRET: "ci-test-secret-not-for-production"
          GOOGLE_CLIENT_ID: "test"
          GOOGLE_CLIENT_SECRET: "test"
          GITHUB_CLIENT_ID: "test"
          GITHUB_CLIENT_SECRET: "test"
          BACKEND_URL: "http://localhost:8000"
          FRONTEND_URL: "http://localhost:3000"
        run: |
          pytest tests/ --cov=app --cov-report=term-missing --tb=short -q

  # ─────────────────────────────────────────────────────────────────────────
  # Frontend: TypeScript build check
  # ─────────────────────────────────────────────────────────────────────────
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Type check & build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: "https://landed-cost-engine.onrender.com"
          NEXT_PUBLIC_API_KEY: "ci-dummy-key"
        run: npm run build
