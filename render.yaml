databases:
  - name: landed-cost-db
    plan: free
    databaseName: landed_cost
    user: landed_cost_user

services:
  - type: web
    name: landed-cost-engine
    runtime: python
    plan: free
    # init_db is intentionally NOT run at build time: the database network may
    # not be reachable during build. Table creation + idempotent seeding happen
    # in the app startup lifespan (app/main.py), which runs when the DB is ready.
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: landed-cost-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: APP_ENV
        value: production
      - key: API_KEYS
        sync: false
    healthCheckPath: /health